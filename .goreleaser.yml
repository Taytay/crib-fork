version: 2

project_name: crib

builds:
  - main: .
    binary: crib
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/fgrehm/crib/cmd.Version={{ .Version }}
      - -X github.com/fgrehm/crib/cmd.Commit={{ .ShortCommit }}
      - -X github.com/fgrehm/crib/cmd.Built={{ .Date }}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  github:
    owner: Taytay
    name: crib-fork
  footer: |
    **Full Changelog**: https://github.com/Taytay/crib-fork/blob/main/CHANGELOG.md

brews:
  - name: crib-fork
    repository:
      owner: Taytay
      name: crib-fork
    directory: Formula
    homepage: https://github.com/Taytay/crib-fork
    description: >-
      Dev containers without the ceremony (unofficial fork of fgrehm/crib).
    license: MIT
    install: |
      bin.install "crib"
    test: |
      assert_match version.to_s, shell_output("#{bin}/crib version")
    caveats: |
      This is an unofficial fork of crib (https://github.com/fgrehm/crib).
      For the official version, see the upstream repository.
